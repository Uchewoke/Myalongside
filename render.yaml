services:
  - type: web
    name: myalongside-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run prisma:migrate:deploy && npm run build --workspace=backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_URL
        value: https://myalongside.com
      - key: ADMIN_URL
        value: https://admin.myalongside.com
      # Set these in the Render dashboard (Environment tab) — not stored in
      # the repo. See .env.example for the full list backend/src reads.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_LIVE_EVENT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
