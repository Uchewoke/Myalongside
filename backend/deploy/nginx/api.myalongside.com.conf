# ─────────────────────────────────────────────────────────────────────────────
# MyAlongside API — Nginx reverse proxy
#
# Pairs with `app.set("trust proxy", 1)` in backend/src/index.ts. Nginx is the
# ONE trusted hop: it strips any client-supplied X-Forwarded-* headers and sets
# its own, so express-rate-limit sees the real client IP and cannot be spoofed.
#
# Deploy: /etc/nginx/sites-available/api.myalongside.com  → symlink into
#         /etc/nginx/sites-enabled/ then `nginx -t && systemctl reload nginx`.
# TLS:    certbot --nginx -d api.myalongside.com   (fills in the 443 block).
# ─────────────────────────────────────────────────────────────────────────────

upstream myalongside_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.myalongside.com;

    # Allow ACME HTTP-01 challenges to pass through before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    # Ubuntu 22.04's stock nginx is 1.18.0, which predates the standalone
    # `http2 on;` directive (needs nginx 1.25.1+) — use the combined form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.myalongside.com;

    # TLS (managed by certbot; paths shown for reference)
    ssl_certificate     /etc/letsencrypt/live/api.myalongside.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.myalongside.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Request body cap ──────────────────────────────────────────────────────
    # Express already caps JSON at 64kb; this rejects oversized bodies at the
    # edge before they reach Node. Stripe webhooks are small, so 256k is ample.
    client_max_body_size 256k;

    # ── CSRF-relevant: never let the client forge forwarding headers ──────────
    # Setting these (rather than *_add_*) OVERWRITES anything the client sent,
    # so the single trusted hop that `trust proxy: 1` expects is genuinely us.
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Host              $host;

    # Strip any inbound X-Forwarded-* the client tried to smuggle in.
    proxy_set_header X-Forwarded-Server "";

    # ── Stripe webhook: raw body, no buffering games ──────────────────────────
    # The signature is computed over the exact bytes, so don't let Nginx alter
    # the body. request_buffering off streams it straight through to Express's
    # express.raw() handler.
    location = /api/stripe/webhook {
        proxy_pass http://myalongside_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;
    }

    # ── Health check (no logging noise) ──────────────────────────────────────
    location = /health {
        proxy_pass http://myalongside_api;
        access_log off;
    }

    # ── Everything else ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://myalongside_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
